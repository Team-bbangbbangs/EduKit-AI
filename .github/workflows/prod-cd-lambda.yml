name: Deploy Lambda Functions - Prod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'edukit-AI-agent-1/**'
      - 'edukit-AI-agent-2/**'

jobs:
  deploy-agent-1:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        working-directory: ./edukit-AI-agent-1
        run: |
          pip install \
          --platform manylinux2014_x86_64 \
          --target=./package \
          --implementation cp \
          --python-version 3.13 \
          --only-binary=:all: \
          --upgrade \
          -r requirements.txt
      
      - name: Create deployment package
        working-directory: ./edukit-AI-agent-1
        run: |
          cd package
          zip -r ../deployment-package.zip .
          cd ..
          zip -g deployment-package.zip lambda_function.py
      
      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.1.9
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: ${{ secrets.LAMBDA_FUNCTION_NAME_AGENT_1 }}
          zip_file: ./edukit-AI-agent-1/deployment-package.zip

  deploy-agent-2:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        working-directory: ./edukit-AI-agent-2
        run: |
          pip install \
          --platform manylinux2014_x86_64 \
          --target=./package \
          --implementation cp \
          --python-version 3.13 \
          --only-binary=:all: \
          --upgrade \
          -r requirements.txt
      
      - name: Create deployment package
        working-directory: ./edukit-AI-agent-2
        run: |
          cd package
          zip -r ../deployment-package.zip .
          cd ..
          zip -g deployment-package.zip lambda_function.py
      
      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.1.9
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: ${{ secrets.AWS_REGION }}
          function_name: ${{ secrets.LAMBDA_FUNCTION_NAME_AGENT_2 }}
          zip_file: ./edukit-AI-agent-2/deployment-package.zip