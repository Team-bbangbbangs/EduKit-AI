name: Prod-cd-lambda

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy-agent1:
    name: Deploy AI Agent 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          pip install --upgrade pip
          pip install awscli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda (agent1)
        run: |
          cd edukit-AI-agent-1
          zip -r9 ../agent1.zip lambda_function.py
          cd package
          zip -r9 ../../agent1.zip .

      - name: Deploy Lambda (agent1)
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_AGENT_1 }} \
            --zip-file fileb://agent1.zip

  deploy-agent2:
    name: Deploy AI Agent 2
    runs-on: ubuntu-latest
    needs: deploy-agent1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          pip install --upgrade pip
          pip install awscli

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda (agent2)
        run: |
          cd edukit-AI-agent-2
          zip -r9 ../agent2.zip lambda_function.py
          cd package
          zip -r9 ../../agent2.zip .

      - name: Deploy Lambda (agent2)
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME_AGENT_2 }} \
            --zip-file fileb://agent2.zip
